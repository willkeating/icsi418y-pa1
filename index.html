
<!DOCTYPE html>
<html lang ="en">
<head>
    <meta charset="UTF-8">
    <title>to-do app</title>
    <link rel="stylesheet" href="style.css"><!--load the css file-->
</head>

<body>

    <div class="container">

        <h1>My Task List</h1><!-- our visible title -->

        <!-- the "form" for making tasks -->
        <form id="task-form"><!-- html form -->
            <label for="task-input">Task:</label>
            <input id="task-input" type="text"> <!--field input-->

            <label for="priority">Priority:</label>
            <select id="priority"><!-- html selector for piority-->
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option><!-- high is never enough!-->
            </select>

        <button type="submit">Add Task</button>
        </form>

        <div id="task-list"></div>
    </div>

</body>
<script src="script.js"></script><!-- load js script (after html so whol doc renders first)-->
</html>
